{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="estrecho">
  <div class="tarjeta">
    <h1>Manejo de Proveedores</h1>
    <p class="suave">Inicie sesión para continuar.</p>
    {% if error %}<div class="aviso aviso-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <p>
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" value="{{ usuario_escrito }}" required autofocus>
      </p>
      <p>
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required>
      </p>
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
